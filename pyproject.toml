[project]
name = "yt-matrix"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "cryptography>=43.0",
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The live end-to-end test spends 100 real quota units of a 10,000/day budget.
# It is opt-in only: `uv run pytest -m live`.
addopts = "-m 'not live and not browser'"
markers = [
    "live: hits the real YouTube API and spends quota",
    "browser: launches Chromium via playwright (slow, but spends no quota)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs/"]

[tool.hatch.build.targets.wheel]
packages = ["ytmatrix"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
