<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yt matrix — layout control</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #0b0b0d; color: #e8e8ea;
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  /* Enough controls now that the row must be allowed to give: nowrap on the
     buttons, and the status text shrinks to an ellipsis rather than forcing
     the header to grow into a column. */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; border-bottom: 1px solid #26262b; flex: none;
    overflow: hidden;
  }
  button {
    font: inherit; font-weight: 600; padding: 7px 13px; border-radius: 6px;
    border: 1px solid #3a3a42; background: #1c1c21; color: #e8e8ea; cursor: pointer;
    white-space: nowrap; flex: none;
  }
  button:hover { background: #26262d; }
  .sets-row {
    display: flex; flex-wrap: wrap; gap: 18px;
    padding: 6px 14px; border-bottom: 1px solid #26262b; flex: none;
  }
  .set-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .set-label { color: #8a8a94; white-space: nowrap; }
  .sets-row select {
    font: inherit; padding: 6px 9px; border-radius: 6px; max-width: 160px;
    border: 1px solid #3a3a42; background: #131317; color: #e8e8ea;
  }
  .sets-row input[type="text"], .sets-row input[type="number"] {
    font: inherit; padding: 6px 9px; border-radius: 6px; width: 140px;
    border: 1px solid #3a3a42; background: #131317; color: #e8e8ea;
  }
  .sets-row input[type="text"]:focus, .sets-row input[type="number"]:focus {
    outline: none; border-color: #5a5a68;
  }
  .shift-num { width: 64px !important; }
  #shift-readout { color: #8a8a94; min-width: 5em; text-align: right; }
  .screens-row {
    display: flex; flex-wrap: wrap; gap: 10px 16px;
    padding: 6px 14px; border-bottom: 1px solid #26262b; flex: none;
  }
  .screen-group { display: flex; align-items: center; gap: 3px; }
  .screen-group .screen-label {
    color: #8a8a94; font-weight: 600; margin-right: 3px; min-width: 1em;
  }
  .screen-group button {
    font-size: 11px; font-weight: 600; padding: 3px 6px; min-width: 0;
  }
  .screen-group .screen-readout {
    color: #8a8a94; font-size: 11px; min-width: 9em; text-align: right;
    margin-right: 2px;
  }
  /* min-width, not 0: this line reports the query, the cache state, the quota
     and every error, and `flex: 1 1 auto; min-width: 0` let it shrink to zero
     width and vanish silently once the header gained one more control. It
     ellipsizes instead. */
  #status { color: #8a8a94; flex: 1 1 auto; min-width: 9em;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status[data-state="error"] { color: #e0685f; }
  #status[data-state="busy"] { color: #d8a657; }
  #audio { color: #8a8a94; flex: 0 1 auto; max-width: 240px; overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; }
  #audio:empty { display: none; }
  #audio[data-locked="true"] { color: #d8a657; }
  button:disabled { opacity: .45; cursor: default; }
  #follow-label {
    display: flex; align-items: center; gap: 6px;
    color: #8a8a94; user-select: none; cursor: pointer; white-space: nowrap;
  }
  #follow-label input, #hover-label input { cursor: pointer; }
  #hover-label {
    display: flex; align-items: center; gap: 6px;
    color: #8a8a94; user-select: none; cursor: pointer; white-space: nowrap;
  }
  #prompt {
    font: inherit; padding: 7px 11px; border-radius: 6px; min-width: 230px;
    border: 1px solid #3a3a42; background: #131317; color: #e8e8ea;
    flex: 0 1 230px;
  }
  #prompt:focus { outline: none; border-color: #5a5a68; }
  #prompt:disabled { opacity: .5; }
  #menu {
    position: fixed; z-index: 50; min-width: 236px; padding: 5px;
    background: #17171c; border: 1px solid #34343d; border-radius: 8px;
    box-shadow: 0 10px 30px #000a; font-size: 13px;
  }
  #menu[hidden] { display: none; }
  #menu .head {
    padding: 6px 10px 8px; color: #6f6f7a; font-size: 11px;
    border-bottom: 1px solid #26262d; margin-bottom: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #menu button {
    display: flex; justify-content: space-between; gap: 16px; width: 100%;
    padding: 7px 10px; border: 0; border-radius: 5px; background: none;
    color: #e8e8ea; font: inherit; font-weight: 400; text-align: left; cursor: pointer;
  }
  #menu button:hover { background: #262630; }
  #menu button .hint { color: #6f6f7a; font-size: 11px; }
  a { color: #8a8a94; flex: none; white-space: nowrap; }
  /* This page has no iframes and no pre-roll: it draws one plain rectangle
     per cell, absolutely positioned from the `rect` the snapshot carries, so
     it and /layout can never disagree about geometry. Nothing here needs
     player.html's cover-fit crop, its pointer-events:none guard against
     YouTube's hover chrome, or its data-preroll opacity gate -- and unlike
     /layout, data-audible and data-locked ARE painted here, because seeing at
     a glance which cell is currently making the sound is the whole reason an
     operator has this window open. */
  #grid { flex: 1; position: relative; min-height: 0; }
  .cell {
    position: absolute; background: #000; overflow: hidden;
    border: 1px solid #26262b; cursor: grab; user-select: none;
  }
  .cell[data-dragging="true"] { cursor: grabbing; }
  .cell[data-audible="true"] { outline: 2px solid #5fb87d; outline-offset: -2px; }
  .cell[data-locked="true"] { outline: 2px solid #d8a657; outline-offset: -2px; }
  .cell .label {
    position: absolute; left: 4px; right: 4px; bottom: 4px;
    font-size: 11px; color: #9a9aa4; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; pointer-events: none;
  }
  .cell .screen-letter {
    position: absolute; top: 4px; left: 4px;
    font-size: 11px; font-weight: 700; color: #6f6f7a; pointer-events: none;
  }
  .cell[data-empty="true"]::after {
    content: "empty"; position: absolute; inset: 0; display: grid;
    place-items: center; color: #55555e; font-size: 12px;
  }
</style>
</head>
<body>
  <header>
    <button id="play">Play</button>
    <button id="pause">Pause</button>
    <button id="mute">Unmute</button>
    <button id="rewind" title="Send every cell back to the start.">Rewind</button>
    <button id="shuffle" title="New videos from the same query. Costs no quota; a reload restores the ranked order.">
      Shuffle
    </button>
    <button id="reset-view" title="Clear zoom and pan on every cell.">Reset view</button>
    <button id="new-query" title="Invents a new query with Gemini from the box to the right, or from the standing theme if it is empty. Costs 100 quota units.">
      Query:
    </button>
    <input id="prompt" type="text" spellcheck="false"
           placeholder="optional steer — leave blank for the theme alone"
           title="A metaprompt: Gemini turns this into a search query using the app's guidance. Press Query: to run it. Costs 100 quota units.">
    <label id="follow-label" title="When off, a new query loads paused and waits for you.">
      <input type="checkbox" id="follow"> follow play state
    </label>
    <label id="hover-label" title="Point at a cell to hear only that one.">
      <input type="checkbox" id="hover-unmute"> hover to unmute
    </label>
    <span id="audio"></span>
    <span id="status">loading…</span>
    <a href="/layout">← broadcast</a>
  </header>
  <div class="sets-row">
    <div class="set-group">
      <span class="set-label">Zoom/pan:</span>
      <select id="zoom-set-select"></select>
      <button id="zoom-set-restore">Restore</button>
      <button id="zoom-set-delete">Delete</button>
      <input id="zoom-set-name" type="text" spellcheck="false" placeholder="name this look">
      <button id="zoom-set-save">Save</button>
    </div>
    <div class="set-group">
      <span class="set-label">Videos:</span>
      <select id="video-set-select"></select>
      <button id="video-set-restore">Restore</button>
      <button id="video-set-delete">Delete</button>
      <input id="video-set-name" type="text" spellcheck="false" placeholder="name this set">
      <button id="video-set-save">Save</button>
    </div>
    <div class="set-group">
      <span class="set-label">Shift:</span>
      <button id="shift-up" title="Nudge the whole wall up">↑</button>
      <button id="shift-down" title="Nudge the whole wall down">↓</button>
      <button id="shift-left" title="Nudge the whole wall left">←</button>
      <button id="shift-right" title="Nudge the whole wall right">→</button>
      <span id="shift-readout">0, 0</span>
      <input id="shift-x" class="shift-num" type="number" step="1" placeholder="x">
      <input id="shift-y" class="shift-num" type="number" step="1" placeholder="y">
      <button id="shift-set">Set</button>
      <button id="shift-reset">Reset</button>
    </div>
  </div>
  <div class="screens-row" id="screens-row"></div>
  <div id="grid"></div>
  <div id="menu" hidden></div>
  <script type="module" src="/static/layout-control.js"></script>
</body>
</html>
